name: Attach extension package to release

on:
  release:
    types:
      - created

permissions:
  contents: write

jobs:
  build-and-attach:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Install extension build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes glib2.0-bin zip

      - name: Build extension package
        run: make build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Shexli
        run: python -m pip install --disable-pip-version-check -r .github/requirements-ci.txt

      - name: Analyze release package with Shexli
        run: |
          shexli bin/colortint@matt.serverus.co.uk.zip --format json > shexli-results.json
          cat shexli-results.json

      - name: Attach package and analysis report to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "${{ github.event.release.tag_name }}"
          "bin/colortint@matt.serverus.co.uk.zip"
          shexli-results.json
          --clobber
