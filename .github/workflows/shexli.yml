name: Build and review GNOME extension

on:
  push:
    branches:
      - main

# Creating issues requires explicit write access when repository workflow
# permissions are otherwise read-only.
permissions:
  contents: read
  issues: write

concurrency:
  group: shexli-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-review:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the source
        uses: actions/checkout@v5

      - name: Install extension build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes glib2.0-bin zip

      - name: Build extension package
        run: make build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Shexli
        # Published from https://github.com/NarkAgni/shexli. Pin the release so
        # a given commit is always checked with the same analyzer rules.
        run: python -m pip install --disable-pip-version-check 'shexli==0.2.1'

      - name: Analyze built package with Shexli
        run: |
          shexli bin/colortint@matt.serverus.co.uk.zip --format json > shexli-results.json
          cat shexli-results.json

      - name: Upload build and analysis report
        uses: actions/upload-artifact@v4
        with:
          name: color-tint-package-and-shexli-report
          path: |
            bin/colortint@matt.serverus.co.uk.zip
            shexli-results.json
          if-no-files-found: error

      - name: Create issues for new Shexli findings
        uses: actions/github-script@v7
        env:
          SHEXLI_RESULTS: shexli-results.json
        with:
          script: |
            const crypto = require('crypto');
            const fs = require('fs');

            const report = JSON.parse(fs.readFileSync(process.env.SHEXLI_RESULTS, 'utf8'));
            const findings = report.findings ?? [];
            const label = 'shexli';

            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label,
              });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label,
                color: '0e8a16',
                description: 'Finding reported by the Shexli extension analyzer',
              });
            }

            for (const finding of findings) {
              const fingerprintSource = JSON.stringify({
                rule: finding.rule_id,
                message: finding.message,
                evidence: finding.evidence,
              });
              const fingerprint = crypto
                .createHash('sha256')
                .update(fingerprintSource)
                .digest('hex');
              const marker = `shexli-fingerprint:${fingerprint}`;

              const existing = await github.rest.search.issuesAndPullRequests({
                // Deliberately include closed issues: reopening a previously fixed
                // finding must not create a second tracking issue.
                q: `repo:${context.repo.owner}/${context.repo.repo} is:issue in:body "${marker}"`,
              });
              if (existing.data.total_count > 0) {
                core.info(`Skipping existing finding ${finding.rule_id}.`);
                continue;
              }

              const evidence = (finding.evidence ?? [])
                .map((item) => {
                  const location = item.line == null ? item.path : `${item.path}:${item.line}`;
                  const snippet = item.snippet
                    ? item.snippet.trim().split('\n').map((line) => `  ${line}`).join('\n')
                    : '';
                  return `- \`${location}\`${snippet ? `\n  \`\`\`js\n${snippet}\n  \`\`\`` : ''}`;
                })
                .join('\n') || '- No source location was reported.';
              const help = finding.source_url
                ? `\n\nGuidance: [${finding.source_section || finding.source_url}](${finding.source_url})`
                : '';
              const body = [
                `<!-- ${marker} -->`,
                '## Shexli finding',
                '',
                finding.message,
                '',
                `- Rule: \`${finding.rule_id}\``,
                `- Severity: \`${finding.severity}\``,
                `- Detected in: ${context.sha}`,
                '',
                '### Evidence',
                evidence,
              ].join('\n') + help;

              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Shexli: ${finding.rule_id} — ${finding.title}`,
                body,
                labels: [label],
              });
              core.info(`Created an issue for ${finding.rule_id}.`);
            }
